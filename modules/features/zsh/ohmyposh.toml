console_title_template = '{{ .Shell }} in {{ .Folder }}'
version = 3
final_space = true
tooltips_action = "extend"

[palette]
  crust = '#11111b'
  blue = '#89b4fa'
  green = '#a6e3a1'
  peach = '#fab387'
  red = '#f38ba8'
  white = '#E0DEF4'
  yellow = '#f9e2af'

[secondary_prompt]
  template = '❯❯ '
  foreground = 'white'
  background = 'transparent'

[transient_prompt]
  foreground_templates = [
    "{{if gt .Code 0}}p:red{{end}}",
    "{{if eq .Code 0}}p:green{{end}}",
  ]
  background = 'transparent'
  template = '❯ '

[[tooltips]]
  leading_diamond = ''
  trailing_diamond = ''
  type = "kubectl"
  tips = ['kubectl', 'k', 'helm', 'argocd', 'flux', 'k9s']
  style = "diamond"
  foreground = 'p:crust'
  background = 'p:peach'
  template = " {{.Context}}{{if .Namespace}} :: {{.Namespace}}{{end}}"

  [tooltips.properties]
    display_default = true

[[tooltips]]
  leading_diamond = ''
  trailing_diamond = ''
  template = '  {{ .Profile }}{{ if .Region }}@{{ .Region }}{{ end }} '
  foreground = 'p:crust'
  background = 'p:peach'
  type = 'aws'
  style = 'diamond'
  tips = ['aws', 'terraform', 'tofu', 'terragrunt']

  [tooltips.properties]
    display_default = true

[[tooltips]]
  leading_diamond = ''
  trailing_diamond = ''
  template = '  {{.Project}} '
  foreground = 'p:crust'
  background = 'p:peach'
  type = 'gcp'
  style = 'diamond'
  tips = ['gcloud', 'terraform', 'tofu', 'terragrunt']

  [tooltips.properties]
    display_default = true

[[blocks]]
  type = 'prompt'
  alignment = 'left'

  [[blocks.segments]]
    leading_diamond = ''
    trailing_diamond = ''
    template = ' {{ .Icon }} '
    foreground = 'p:crust'
    background = 'p:peach'
    type = 'os'
    style = 'diamond'

  [[blocks.segments]]
    trailing_diamond = ''
    template = '  {{ path .Path .Location }} '
    foreground = 'p:crust'
    background = 'p:blue'
    type = 'path'
    style = 'diamond'

    [blocks.segments.properties]
      style = 'folder'

  [[blocks.segments]]
    template = ' {{ if .UpstreamURL }}{{ url .UpstreamIcon .UpstreamURL }} {{ end }}{{ .HEAD }}{{if .BranchStatus }} {{ .BranchStatus }}{{ end }}{{ if .Working.Changed }}  {{ .Working.String }}{{ end }}{{ if .Staging.Changed }}  {{ .Staging.String }}{{ end }} '
    foreground = 'p:crust'
    trailing_diamond = ''
    background = 'p:green'
    type = 'git'
    style = 'diamond'
    foreground_templates = ['{{ if or (.Working.Changed) (.Staging.Changed) }}p:crust{{ end }}', '{{ if and (gt .Ahead 0) (gt .Behind 0) }}p:white{{ end }}', '{{ if gt .Ahead 0 }}p:white{{ end }}']
    background_templates = ['{{ if or (.Working.Changed) (.Staging.Changed) }}p:yellow{{ end }}', '{{ if and (gt .Ahead 0) (gt .Behind 0) }}p:red{{ end }}', '{{ if gt .Ahead 0 }}#49416D{{ end }}', '{{ if gt .Behind 0 }}#7A306C{{ end }}']

    [blocks.segments.properties]
      branch_template = '{{ trunc 25 .Branch }}'
      fetch_status = true
      fetch_upstream_icon = true

  [[blocks.segments]]
    template = '  '
    foreground = 'p:white'
    powerline_symbol = ''
    background = 'p:yellow'
    type = 'root'
    style = 'powerline'


[[blocks]]
  type = 'rprompt'

  [[blocks.segments]]
    type = 'executiontime'
    style = 'plain'
    foreground = 'p:yellow'
    background = 'transparent'
    template = '{{ .FormattedMs }} '

  [[blocks.segments]]
    type = 'nix-shel'
    style = 'plain'
    foreground = 'p:yellow'
    background = 'transparent'
    template = "(nix-{{ .Type }})"

  [[blocks.segments]]
    template = ' '
    foreground = 'p:green'
    background = 'transparent'
    type = 'node'
    style = 'plain'

    [blocks.segments.properties]
      display_mode = 'files'
      fetch_package_manager = false
      home_enabled = false

  [[blocks.segments]]
    template = ' '
    foreground = 'p:blue'
    background = 'transparent'
    type = 'go'
    style = 'plain'

    [blocks.segments.properties]
      fetch_version = true

  [[blocks.segments]]
    template = ' '
    foreground = 'p:yellow'
    background = 'transparent'
    type = 'python'
    style = 'plain'

    [blocks.segments.properties]
      display_mode = 'files'
      fetch_version = false
      fetch_virtual_env = false

  [[blocks.segments]]
    leading_diamond = ''
    trailing_diamond = ''
    template = ' {{ if gt .Code 0 }}{{ else }}{{ end }} '
    foreground = 'p:white'
    background = 'p:blue'
    type = 'status'
    style = 'diamond'
    background_templates = ['{{ if gt .Code 0 }}p:red{{ end }}']

    [blocks.segments.properties]
      always_enabled = true
