bind o display-popup -w 80% -h 80% -E "\
  dir=\$(zoxide query --list | fzf --ansi --height=100% --layout=reverse --no-info \
  --preview 'eza --tree --color=always --icons=always --level=2 {}' \
  --preview-window right:50%) && \
  tmux new-window -c \"\$dir\""

# WezTerm + Yazi image preview passthrough
set -g allow-passthrough all
# set -gu update-environment
# set -ga update-environment TERM
# set -ga update-environment TERM_PROGRAM
# set -ga update-environment TERM_PROGRAM_VERSION
# set -ga update-environment WEZTERM_EXECUTABLE
# set -ga update-environment WEZTERM_PANE
# set -ga update-environment WEZTERM_UNIX_SOCKET
# set -s input-buffer-size 104857600

# WezTerm terminal capabilities
set -gu terminal-features
set -as terminal-features ",wezterm:RGB:usstyle:overline:extkeys"
set -as terminal-features ",xterm-256color:RGB:usstyle:extkeys"
set -s extended-keys on
set -s extended-keys-format csi-u
# split windows and open panes in current path
unbind %
bind | split-window -h -c "#{pane_current_path}"

unbind '"'
bind - split-window -v -c "#{pane_current_path}"

# resize panes using Prefix + hjkl
bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r l resize-pane -R 5
bind -r h resize-pane -L 5

# swap panes using Prefix + Shift+hjkl
bind -r H swap-pane -s '{left-of}'
bind -r J swap-pane -s '{down-of}'
bind -r K swap-pane -s '{up-of}'
bind -r L swap-pane -s '{right-of}'

# allow select and copy with vim motions
bind -T copy-mode-vi 'v' send -X begin-selection
bind -T copy-mode-vi 'C-v' send -X rectangle-toggle
bind -T copy-mode-vi 'y' send -X copy-selection

# allow copy via mouse
unbind -T copy-mode-vi MouseDragEnd1Pane

# set status bar to top
set -g status-position top

# renumber windows
set-option -g renumber-windows on

# activate resurrect and continuum
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-nvim 'session'

# Restore vim sessions using vim-obsession
set -g @resurrect-strategy-vim 'session'
# Restore neovim sessions (if applicable)
set -g @resurrect-strategy-nvim 'session'

set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'   

# Configure the catppuccin plugin
set -g @catppuccin_flavor "macchiato"
set -g @catppuccin_window_status_style "rounded"
# leave this unset to let applications set the window title
set -g @catppuccin_window_text "#{b:pane_current_path} #W"
set -g @catppuccin_window_current_text "#{b:pane_current_path} #W"
set -g @catppuccin_window_flags "icon"
set -g @catppuccin_window_current_number_color "#{@thm_mauve}"
